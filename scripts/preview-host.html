<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>时光花园测试宿主</title>
  <style>
    :root { font: 15px/1.5 system-ui, sans-serif; color: #233042; background: #eef2f7; }
    body { margin: 20px auto; max-width: 1500px; padding: 0 18px; }
    h1 { margin: 0; font-size: 24px; }
    p { margin: 6px 0 14px; }
    .controls, .notifications { background: white; border: 1px solid #d4dce8; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    .controls { display: flex; align-items: end; flex-wrap: wrap; gap: 12px; }
    label { display: grid; gap: 4px; }
    input, select, button { padding: 8px 11px; font: inherit; border: 1px solid #aebed1; border-radius: 6px; }
    button { cursor: pointer; background: #f0f6ff; }
    #worker-status { font-size: 13px; }
    iframe { width: 100%; height: 760px; border: 1px solid #d4dce8; border-radius: 10px; background: white; }
    .notifications { margin-top: 14px; }
    .notifications header { display: flex; gap: 16px; align-items: center; }
    h2 { margin: 0; font-size: 18px; }
    #notification-list { padding-left: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
    #notification-list time { color: #66758b; margin-right: 10px; }
  </style>
  <script src="/preview-host.js" defer></script>
</head>
<body>
  <h1>时光花园测试宿主</h1>
  <p><strong>测试宿主：不是真实 Hindsight / 系统通知。</strong>下方运行插件原始 UI 与后台 Worker，数据库仅存临时目录。</p>
  <section class="controls" aria-label="模拟焦点">
    <label>当前应用<input id="focus-app" value="Chrome" autocomplete="off"></label>
    <label>网站域名<input id="focus-host" value="example.com" autocomplete="off"></label>
    <label>活动分类<select id="focus-category"><option value="reading">阅读（工作）</option><option value="code">编程（工作）</option><option value="games">游戏（娱乐）</option><option value="">未分类</option></select></label>
    <label>分类列表模拟<select id="catalog-mode"><option value="normal">正常</option><option value="renamed">阅读分类改名</option><option value="deleted">删除阅读分类</option><option value="empty">空列表</option><option value="fail">读取失败</option></select></label>
    <button id="send-focus" type="button">发送焦点事件</button>
    <button id="send-away" type="button">用户离开</button>
    <button id="restart-worker" type="button">重新启动后台</button>
    <label>演示花园<select id="scene-count"><option value="0">空花园</option><option value="1">1 株</option><option value="8" selected>8 株</option><option value="26">26 株（分园）</option><option value="56">56 株（跨周，每周 28 株）</option><option value="122">122 株（四周收藏）</option><option value="200">200 株（旧档迁移）</option><option value="1000">1000 株（逐株归档）</option><option value="5001">5001 株（大收藏）</option></select></label>
    <button id="seed-garden" type="button">载入演示花园（仅测试）</button>
    <output id="worker-status">后台启动中…</output>
  </section>
  <iframe id="plugin-ui" title="时光花园界面" sandbox="allow-scripts allow-same-origin" src="/plugin/ui/index.html"></iframe>
  <section class="notifications" aria-label="捕获通知">
    <header><h2>捕获通知（<span id="notification-count">0</span>）</h2><button id="clear-notifications" type="button">清空通知</button></header>
    <ol id="notification-list"></ol>
  </section>
</body>
</html>
